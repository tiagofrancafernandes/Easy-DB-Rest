
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    root /var/www/html;
    index index.php index.htm index.html;

    ## Your domains
    server_name app.easydbrest.tiagofranca.com app.easydbrest.com local.dbrest.com;

    ## mkcert -key-file /etc/mkcert/certs/easydbrest.com/privkey.pem -cert-file /etc/mkcert/certs/easydbrest.com/fullchain.pem app.easydbrest.tiagofranca.com app.easydbrest.com local.dbrest.com '*.dbrest.com'
    ssl_certificate /etc/mkcert/certs/easydbrest.com/fullchain.pem;
    ssl_certificate_key /etc/mkcert/certs/easydbrest.com/privkey.pem;

    if ($http_x_forwarded_proto = 'http' ) {
        return 301 https://$host$request_uri;
    }

    location ~ /.well-known {
        allow all;
    }

    location / {
        ## Your app base url (target to proxy)
        proxy_pass http://127.0.0.1:8000;
    }
}
